name: Build Kernel (OriginSU)

# Builds the Exynos850 (Galaxy A13 / SM-A135F) 4.19 kernel against the
# *latest* OriginSU commit, using the Neutron toolchain.
#
# The kernel-side integration (SELinux exports + defconfig) lives in
# .github/originsu/kernel-integration.diff, so this repo stays close to the
# vendor tree while OriginSU always tracks its latest main branch at build
# time. Without SuSFS the diff also installs OriginSU's manual hook call sites.
#
# SuSFS 2.3.0 (4.19 non-GKI backport) is applied at build time unless the
# `susfs` input is "false". It selects OriginSU's SuSFS inline-hook mode and
# applies the pinned SuSFS inline-hook script. This tree backports the
# fs_context mount API, so the vfs_kern_mount hunk is replaced by
# .github/originsu/susfs-2.3.0-vfs-create-mount.diff.

on:
  workflow_dispatch:
    inputs:
      originsu_repo:
        description: 'OriginSU repository (owner/name)'
        required: false
        default: 'samakshkambxj/OriginSU'
      originsu_ref:
        description: 'OriginSU ref: branch, tag or commit (default: latest main)'
        required: false
        default: 'main'
      defconfig:
        description: 'Kernel defconfig name'
        required: false
        default: 'exynos850-a13nsxx_defconfig'
      susfs:
        description: 'Apply SuSFS 2.3.0 (4.19 non-GKI backport)'
        required: false
        default: 'true'
  push:
    branches: [originsu, lineage-24.0]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [originsu, lineage-24.0]
    paths-ignore:
      - '**/*.md'
  schedule:
    # Weekly: rebuild automatically to pick up new OriginSU commits.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  OUT: out

jobs:
  build:
    name: Build exynos850 kernel + OriginSU
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            lz4 zstd cpio rsync xz-utils zip unzip curl git

      - name: Set up Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -fsSLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/neutron-clang/bin/clang" --version | head -1

      - name: Fetch OriginSU (latest commit)
        id: originsu
        run: |
          set -euo pipefail
          REPO="${{ github.event.inputs.originsu_repo || 'samakshkambxj/OriginSU' }}"
          REF="${{ github.event.inputs.originsu_ref || 'main' }}"

          rm -rf KernelSU
          git clone "https://github.com/${REPO}.git" KernelSU
          cd KernelSU
          git fetch --tags --force origin

          # Prefer remote-tracking branch, fall back to tag/commit.
          if git rev-parse --verify --quiet "origin/${REF}" >/dev/null; then
            git checkout --force "origin/${REF}"
          else
            git checkout --force "${REF}"
          fi
          git submodule update --init --recursive || true

          SHA="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=12 HEAD)"
          SUBJECT="$(git log -1 --format='%s')"
          echo "sha=${SHA}"       >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}"   >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}"     >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"       >> "$GITHUB_OUTPUT"

          {
            echo "### OriginSU"
            echo ""
            echo "- repo: \`${REPO}\`"
            echo "- ref: \`${REF}\`"
            echo "- commit: [\`${SHORT}\`](https://github.com/${REPO}/commit/${SHA})"
            echo "- subject: ${SUBJECT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply OriginSU kernel integration
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.susfs }}" != "false" ]; then
            # SuSFS uses OriginSU's inline-hook mode. Keep only the non-hook
            # integration here; the SuSFS step adds the inline hook call sites.
            git apply --verbose \
              --include='arch/arm64/configs/*' \
              --include='drivers/Kconfig' \
              --include='drivers/Makefile' \
              --include='security/selinux/selinuxfs.c' \
              --include='security/selinux/ss/services.c' \
              .github/originsu/kernel-integration.diff
          elif git apply --check .github/originsu/kernel-integration.diff 2>/dev/null; then
            git apply --verbose .github/originsu/kernel-integration.diff
          else
            echo "::warning::Integration patch did not apply cleanly (already applied or tree changed); continuing."
          fi
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -l drivers/kernelsu
          grep -n "CONFIG_KSU=y\|CONFIG_KSU_MANUAL_HOOK=y\|CONFIG_LOCALVERSION" \
            arch/arm64/configs/${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}

      - name: Apply SuSFS 2.3.0
        if: ${{ github.event.inputs.susfs != 'false' }}
        env:
          SUSFS_PATCH_COMMIT: 118ac2bc4f8bc25a41f0aef0d766ddc977feaec3
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_COMMIT}/Patches/Patch/susfs_patch_to_4.19.patch"
          curl -fsSL "$URL" -o /tmp/susfs_patch_to_4.19.patch

          # This Samsung tree backports the fs_context mount API, so exactly one
          # hunk (vfs_kern_mount) is expected to reject. It is replaced by the
          # fs_context-compatible compat patch below.
          rm -f /tmp/susfs.rej
          if ! patch -p1 -F3 --forward --no-backup-if-mismatch -r /tmp/susfs.rej \
                < /tmp/susfs_patch_to_4.19.patch; then
            echo "::notice::SuSFS patch reported rejects; checking them"
          fi
          if [ -s /tmp/susfs.rej ]; then
            if ! grep -q 'vfs_kern_mount' /tmp/susfs.rej; then
              echo "::error::Unexpected SuSFS rejects"
              cat /tmp/susfs.rej
              exit 1
            fi
            echo "::notice::Expected vfs_kern_mount reject; applying fs_context compat hunk"
          fi

          git apply .github/originsu/susfs-2.3.0-vfs-create-mount.diff

          # OriginSU's SuSFS inline-hook mode uses the SuSFS project's hook
          # call sites, not the manual-hook integration hunks. Apply the
          # pinned inline-hook script and adapt ksu_handle_sys_read to
          # OriginSU's three-argument signature.
          INLINE_URL="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${SUSFS_PATCH_COMMIT}/Patches/susfs_inline_hook_patches.sh"
          curl -fsSL "$INLINE_URL" -o /tmp/susfs_inline_hook_patches.sh
          bash /tmp/susfs_inline_hook_patches.sh

          sed -i 's/extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);/extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);/' fs/read_write.c
          sed -i 's/ksu_handle_sys_read(fd);/ksu_handle_sys_read(fd, \&buf, \&count);/' fs/read_write.c

          # Verify every hook OriginSU's inline check expects.
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -q 'ksu_handle_setresuid' kernel/sys.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c

          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}"
          sed -i -e '/^CONFIG_KSU_MANUAL_HOOK=y$/d' \
                 -e '/^CONFIG_KSU_MANUAL_HOOK_AUTO_.*=y$/d' "$DEFCONFIG"
          printf '\nCONFIG_KSU_SUSFS=y\n' >> "$DEFCONFIG"
          grep -m1 'SUSFS_VERSION' include/linux/susfs.h
          grep -n 'CONFIG_KSU_SUSFS=y' "$DEFCONFIG"
          grep -n 'ksu_handle_setresuid' kernel/sys.c
          grep -n 'ksu_handle_sys_read' fs/read_write.c
          grep -n 'ksu_handle_input_handle_event' drivers/input/input.c

          SUSFS_VERSION="$(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h)"
          {
            echo "### SuSFS"
            echo ""
            echo "- version: \`${SUSFS_VERSION}\`"
            echo "- source: \`JackA1ltman/NonGKI_Kernel_Build_2nd@${SUSFS_PATCH_COMMIT}\` (4.19 non-GKI backport)"
            echo "- mode: \`inline hook\`"
            echo "- mount-api compat: \`fs/namespace.c\` \`vfs_create_mount()\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            ${{ github.event.inputs.defconfig || 'exynos850-a13nsxx_defconfig' }}

          # Fail early if OriginSU did not end up enabled.
          grep -q '^CONFIG_KSU=y' "$OUT/.config"
          if [ "${{ github.event.inputs.susfs }}" != "false" ]; then
            grep -q '^CONFIG_KSU_SUSFS=y' "$OUT/.config"
            ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT/.config"
          else
            grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT/.config"
          fi
          grep -q '^CONFIG_LOCALVERSION="-exynos850-Origin"' "$OUT/.config"

      - name: Build kernel
        run: |
          set -euo pipefail
          # Neutron clang promotes this pre-existing vendor warning (a char *
          # passed to sizeof()) to an error; keep it as a warning.
          make -j"$(nproc)" ARCH="$ARCH" O="$OUT" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=sizeof-pointer-memaccess"

      - name: Verify image + OriginSU symbols
        run: |
          set -euo pipefail
          test -f "$OUT/arch/arm64/boot/Image"
          echo "kernel.release: $(cat "$OUT/include/config/kernel.release")"
          grep -q 'exynos850-Origin' "$OUT/include/config/kernel.release"
          echo "ksu_* symbols in System.map: $(grep -c ' ksu_' "$OUT/System.map" || true)"
          echo "OriginSU commit: ${{ steps.originsu.outputs.short }}"
          if [ "${{ github.event.inputs.susfs }}" != "false" ]; then
            grep -q '^CONFIG_KSU_SUSFS=y' "$OUT/.config"
            echo "SuSFS: $(grep -m1 'SUSFS_VERSION' include/linux/susfs.h)"
            echo "susfs_* symbols in System.map: $(grep -c ' susfs_' "$OUT/System.map" || true)"
          fi

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$OUT/arch/arm64/boot/Image"          artifacts/ 2>/dev/null || true
          cp "$OUT/arch/arm64/boot/Image.gz"       artifacts/ 2>/dev/null || true
          cp "$OUT/System.map"                     artifacts/ 2>/dev/null || true
          cp "$OUT/.config"                        artifacts/config
          cp "$OUT/include/config/kernel.release"  artifacts/ 2>/dev/null || true
          find "$OUT/arch/arm64/boot/dts" -name '*.dtb'  -exec cp {} artifacts/ \; 2>/dev/null || true
          find "$OUT/arch/arm64/boot/dts" -name '*.dtbo' -exec cp {} artifacts/ \; 2>/dev/null || true
          # Modules -> tarball to keep the artifact tidy.
          if find "$OUT" -name '*.ko' | grep -q .; then
            ( cd "$OUT" && find . -name '*.ko' -print0 | tar --null -T - -czf "$OLDPWD/artifacts/modules.tar.gz" )
          fi
          ls -lh artifacts

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exynos850-Origin-kernel-${{ steps.originsu.outputs.short }}${{ github.event.inputs.susfs == 'false' && '-nosusfs' || '-susfs' }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
